<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./main.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Produtos</title>
</head>
<body class="bg-gray-400 flex flex-col items-center justify-center h-screen gap-4">
    <div class="rounded bg-gray-200 w-[90%] h-[90%] flex flex-col items-center gap-3">
        <h1 class="text-2xl">Lista de Produtos</h1>
        <input 
            placeholder="código"
            type="text" 
            class="border rounded p-8 px8 py-2"
            id="codigo"
        >
        <input 
            placeholder="produto"
            type="text" 
            class="border rounded p-8 px8 py-2"
            id="produto"
        >
        <input 
            placeholder="quantidade"
            type="text" 
            class="border rounded p-8 px8 py-2"
            id="quantidade"
        >
        <div>
            <button 
                class="bg-blue-400 text-white px-4 py-2 rounded" 
                onclick="adicionarProduto()"
            >
                Adicionar
            </button>

            <button 
                class="bg-blue-400 text-white px-4 py-2 rounded" 
                onclick="limparLista() "
            >
                Limpar Lista
            </button>
        </div>

        <div 
            id="lista" 
            class="bg-white border rounded w-[80%] h-[55%] flex flex-col items-center gap-2 overflow-y-scroll p-4"
        >
        </div>
    </div>

</body>
</html>
